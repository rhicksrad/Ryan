<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b5a3c" />
    <title>Project City · Ryan Hicks</title>
    <meta
      name="description"
      content="A 3D town where every named building is one of Ryan Hicks' GitHub projects and its height is the commit count. Click one to play the game, open the dashboard, or read the source."
    />
    <link rel="canonical" href="https://rhicksrad.github.io/Ryan/" />
    <meta property="og:title" content="Project City · Ryan Hicks" />
    <meta property="og:description" content="A 3D town where every named building is a real GitHub project and its height is the commit count." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rhicksrad.github.io/Ryan/" />
    <meta property="og:image" content="https://rhicksrad.github.io/Ryan/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Project City in late afternoon: glass towers, a clock tower, houses, and a river, each named building a GitHub project." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://rhicksrad.github.io/Ryan/og.jpg" />
    <meta name="twitter:title" content="Project City · Ryan Hicks" />
    <meta name="twitter:description" content="Every named building is a real GitHub project. Height is the commit count." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ryan Hicks",
        "url": "https://rhicksrad.github.io/Ryan/",
        "sameAs": ["https://github.com/rhicksrad"]
      }
    </script>
  </head>
  <body>
    <div id="scene" aria-hidden="true"></div>

    <header class="hud" data-test="hud">
      <button class="brand" id="btn-about" type="button" title="About this town">
        <h1>Project City</h1>
        <p id="brand-stats">Ryan Hicks, builder</p>
      </button>
      <nav class="hud-actions" aria-label="Site">
        <button id="btn-daynight" type="button" aria-label="Toggle day and night"></button>
        <button id="btn-tour" type="button" aria-pressed="false" title="Fly through the biggest projects (T)"></button>
        <button id="btn-list" type="button" title="List every project (D)">Directory</button>
        <a href="https://github.com/rhicksrad" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </header>

    <nav id="legend" aria-label="Districts"></nav>

    <div id="hint">Drag to look around. Click a building to visit it, or a resident to hear from them. Arrow keys step through projects.</div>

    <div id="tooltip" hidden></div>
    <aside id="panel" hidden aria-live="polite" tabindex="-1"></aside>
    <div id="list-overlay" hidden></div>

    <div id="loader">
      <div class="brand">
        <h1>Project City</h1>
        <p>City limit</p>
      </div>
      <div class="loader-note">Pouring concrete</div>
    </div>

    <noscript>
      <div class="noscript">
        This town is drawn with JavaScript. The projects themselves live at
        <a href="https://github.com/rhicksrad">github.com/rhicksrad</a>.
      </div>
    </noscript>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
