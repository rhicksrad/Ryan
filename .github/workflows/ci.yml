name: CI

# Two lanes. `gate` is the fast pull request check (aim: under 3 minutes).
# `e2e` is the heavier browser run on desktop and phone.
#
# Where jobs run: on Ryan's PCs when the repo variable CI_RUNNER is `local` and
# the event is trusted (a branch in this repo, a push, or a manual run). Pull
# requests from forks always run on GitHub's machines. Delete CI_RUNNER to send
# everything back to GitHub, for example when the PCs are off: a job whose
# labels match no online runner queues silently instead of failing. Browser jobs
# have their own switch, CI_E2E_RUNNER, set only once a PC can run Chromium.
# See tools/ci/README.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**/*.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ vars.CI_RUNNER == 'local'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && fromJSON('["self-hosted","web-trusted"]')
      || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # The PCs keep a warm ~/.npm; only GitHub's machines need the remote cache.
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Check size budget
        run: npm run check:size

      - name: Clean workspace
        if: always() && runner.environment == 'self-hosted'
        run: git clean -ffdxq

  e2e:
    name: e2e
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ vars.CI_RUNNER == 'local' && vars.CI_E2E_RUNNER == 'local'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && fromJSON('["self-hosted","web-trusted","playwright","e2e"]')
      || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build site
        run: npm run build

      # GitHub's machines start empty and have sudo. The PCs keep browsers in a
      # shared folder and had their system libraries installed once by a person.
      - name: Install browser (GitHub machine)
        if: runner.environment == 'github-hosted'
        run: npx playwright install --with-deps chromium

      - name: Install browser (PC)
        if: runner.environment == 'self-hosted'
        run: npx playwright install chromium

      # Several repos share a PC, so never assume port 4173 is free there.
      - name: Pick a free port
        run: echo "E2E_PORT=$(node -e "const s=require('net').createServer().listen(0,'127.0.0.1',()=>{console.log(s.address().port);s.close()})")" >> "$GITHUB_ENV"

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            artifacts/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean workspace
        if: always() && runner.environment == 'self-hosted'
        run: git clean -ffdxq
