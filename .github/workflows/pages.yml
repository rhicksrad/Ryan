name: Deploy site to GitHub Pages

# Build on Ryan's PCs when CI_RUNNER is `local` (pushes to main and manual runs
# are trusted events). The deploy itself always runs on GitHub's machines: it
# takes seconds and keeps the Pages deploy token off the PCs.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false # never cut off a deployment that is halfway through

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER == 'local' && fromJSON('["self-hosted","web-trusted"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # Every deploy ships with this minute's commit counts and any repos created
      # since the weekly refresh. If GitHub's API is unreachable, ship what is committed.
      - name: Refresh repo stats
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-stats.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Check size budget
        run: npm run check:size

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Clean workspace
        if: always() && runner.environment == 'self-hosted'
        run: git clean -ffdxq

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
